<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>Bauhaus (包豪斯) · 风格样张 — ui-ux-pro-max + frontend-design</title>
<meta name="description" content="UI 设计提示词库 · 风格样张与官方提示词，复制后交给 AI 复刻同款网页。">
<style>
@import url('https://fonts.googleapis.com/css2?Outfit:wght@400;500;700;900&display=swap');
:root {
  --bg: #F8FAFC; --fg: #0F172A; --muted: #475569; --card: #FFFFFF;
  --border: rgba(208,32,32,.28); --primary: #D02020; --secondary: #1040C0;
  --accent: #F0C020; --on-primary: #fff;
  --radius: 0px; --btn-radius: 0px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Outfit', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--fg); line-height: 1.6;
  
}
h1, h2, h3, .num { font-family: 'Outfit', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.topbar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 2.5px solid var(--fg); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 62px; }
.logo { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--fg); font-family: 'Outfit', sans-serif; }
.logo-mark { width: 32px; height: 32px; border-radius: calc(var(--radius) * .6);
  background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
nav { display: flex; gap: 22px; }
nav a { color: var(--muted); text-decoration: none; font-size: 14.5px; }
nav a:hover, nav a:focus-visible { color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: 14.5px;
  padding: 11px 22px; border-radius: var(--btn-radius);
  cursor: pointer; text-decoration: none; border: 2.5px solid var(--fg);
  background: var(--card); color: var(--fg);
  transition: transform 0ms, box-shadow 0ms, background 0ms;
}
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-primary:hover { transform: translateY(-2px);  }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.card { background: var(--card); border: 2.5px solid var(--fg); border-radius: var(--radius);
  box-shadow: 4px 4px 0px 0px #121212, active:translate-x-[2px] active:translate-y-[2px] active:shadow-none, border: 2px solid #121212, font-family: Outfit, font-weight: 900 uppercase tracking-tighter (headlines); padding: 24px;
  transition: transform 0ms, box-shadow 0ms; }
.card:hover { transform: translateY(-4px); box-shadow: 4px 4px 0px 0px #121212, active:translate-x-[2px] active:translate-y-[2px] active:shadow-none, border: 2px solid #121212, font-family: Outfit, font-weight: 900 uppercase tracking-tighter (headlines);  }
.card-icon { width: 42px; height: 42px; border-radius: calc(var(--radius) * .7);
  background: var(--primary); color: var(--on-primary);
  display: grid; place-items: center; margin-bottom: 14px; }
.card h3 { font-size: 16.5px; margin-bottom: 6px; }
.card p { font-size: 13.5px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.stat b { display: block; font-size: 34px; font-weight: 800; color: var(--primary); }
.stat span { font-size: 13px; color: var(--muted); }
footer { border-top: 2.5px solid var(--fg); padding: 26px 0; text-align: center; font-size: 13px; color: var(--muted); }
footer a { color: var(--primary); }
@keyframes gradflow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.grid3 .card:nth-child(1) .card-icon{border-radius:50%} .grid3 .card:nth-child(3) .card-icon{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 36px 16px;  }
.phone { width: 390px; max-width: 100%; height: 780px; background: var(--bg);
  border: 2.5px solid var(--fg); border-radius: 44px; overflow: hidden; position: relative;
  box-shadow: 4px 4px 0px 0px #121212, active:translate-x-[2px] active:translate-y-[2px] active:shadow-none, border: 2px solid #121212, font-family: Outfit, font-weight: 900 uppercase tracking-tighter (headlines); display: flex; flex-direction: column; }
.notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 26px; border-radius: 999px; background: var(--fg); opacity: .92; z-index: 2; }
.statusbar { display: flex; justify-content: space-between; padding: 16px 26px 6px; font-size: 12.5px; color: var(--muted); }
.apphead { display: flex; justify-content: space-between; align-items: center; padding: 12px 22px; }
.apphead small { font-size: 12.5px; color: var(--muted); }
.apphead h1 { font-size: 22px; font-weight: 800; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.summary { display: flex; justify-content: space-around; text-align: center; margin: 4px 18px 14px; padding: 16px; }
.summary b { display: block; font-size: 24px; font-weight: 800; color: var(--primary); }
.summary span { font-size: 11.5px; color: var(--muted); }
.tabs { display: flex; gap: 8px; padding: 0 18px 12px; }
.tab { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 16px;
  border-radius: 999px; border: 2.5px solid var(--fg); background: var(--card); color: var(--muted); cursor: pointer; }
.tab.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.leads { flex: 1; overflow-y: auto; padding: 0 18px; display: grid; gap: 10px; align-content: start; }
.lead { display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  background: var(--card); border: 2.5px solid var(--fg); border-radius: var(--radius); }
.lead-score { width: 42px; height: 42px; flex: none; display: grid; place-items: center;
  font-weight: 800; font-size: 15px; border-radius: calc(var(--radius) * .7); }
.lead:nth-child(1) .lead-score { background: var(--primary); color: var(--on-primary); }
.lead:nth-child(n+2) .lead-score { background: rgba(208,32,32,.14); color: var(--primary); }
.lead b { display: block; font-size: 14.5px; }
.lead small { font-size: 12px; color: var(--muted); }
.lead > div { flex: 1; }
.pill { font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.pill.hot { background: var(--primary); color: var(--on-primary); }
.pill.warm { background: rgba(208,32,32,.14); color: var(--primary); }
.pill.cold { background: rgba(120,120,130,.14); color: var(--muted); }
.tabbar { display: flex; border-top: 2.5px solid var(--fg); background: var(--card); padding: 8px 0 18px; }
.tabbar a { flex: 1; display: grid; place-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 10.5px; }
.tabbar a.on { color: var(--primary); }
.stage-note { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
.stage-note a { color: var(--primary); }

</style>
</head>
<body>
<div class="stage">

    <div class="notch" aria-hidden="true"></div>

      <a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>铜版班</span></a>
      <a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg><span>限量编号</span></a>
      <a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>我的</span></a>
    </nav>
  </div>
  <p class="stage-note">黑桥版画社 · 手印限量 · <a href="../style-catalog.html">返回风格目录</a> · <a href="../index.html">八版精修样张</a></p>
</div>

</body>
</html>
