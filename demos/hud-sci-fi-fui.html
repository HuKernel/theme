<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>HUD / Sci-Fi FUI · 风格样张 — ui-ux-pro-max + frontend-design</title>
<style>
@import url('https://fonts.googleapis.com/css2?Fira+Code:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');
:root {
  --bg: #F8FAFC; --fg: #0F172A; --muted: #475569; --card: #FFFFFF;
  --border: rgba(0,255,255,.28); --primary: #00FFFF; --secondary: #0080FF;
  --accent: #FF0000; --on-primary: #111;
  --radius: 4px; --btn-radius: 2px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Fira Code', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--fg); line-height: 1.6;
  
}
h1, h2, h3, .num { font-family: 'Share Tech Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.topbar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid rgba(0,255,255,.28); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 62px; }
.logo { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--fg); font-family: 'Share Tech Mono', sans-serif; }
.logo-mark { width: 32px; height: 32px; border-radius: calc(var(--radius) * .6);
  background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
nav { display: flex; gap: 22px; }
nav a { color: var(--muted); text-decoration: none; font-size: 14.5px; }
nav a:hover, nav a:focus-visible { color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: 14.5px;
  padding: 11px 22px; border-radius: var(--btn-radius);
  cursor: pointer; text-decoration: none; border: 1px solid rgba(0,255,255,.28);
  background: var(--card); color: var(--fg);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
}
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-primary:hover { transform: translateY(-2px); text-transform: uppercase; letter-spacing: .12em; box-shadow: 0 0 18px rgba(0,255,255,.4); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.card { background: var(--card); border: 1px solid rgba(0,255,255,.28); border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(0,255,255,.13); padding: 24px;
  transition: transform 200ms ease, box-shadow 200ms ease; }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,255,255,.2);  }
.card-icon { width: 42px; height: 42px; border-radius: calc(var(--radius) * .7);
  background: var(--primary); color: var(--on-primary);
  display: grid; place-items: center; margin-bottom: 14px; }
.card h3 { font-size: 16.5px; margin-bottom: 6px; }
.card p { font-size: 13.5px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.stat b { display: block; font-size: 34px; font-weight: 800; color: var(--primary); }
.stat span { font-size: 13px; color: var(--muted); }
footer { border-top: 1px solid rgba(0,255,255,.28); padding: 26px 0; text-align: center; font-size: 13px; color: var(--muted); }
footer a { color: var(--primary); }
@keyframes gradflow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.hero { padding: 72px 0 48px; text-align: center; position: relative; }
.doc-meta {
  font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted);
  letter-spacing: .04em; margin-bottom: 20px;
  display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center;
}
h1 { font-size: clamp(32px, 5vw, 54px); font-weight: 800; line-height: 1.16; margin-bottom: 18px; text-shadow: 0 0 18px rgba(0,255,255,.6); }
.hl { color: var(--primary); }
.sub { font-size: 17px; color: var(--muted); max-width: 560px; margin: 0 auto 34px; }
.cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.section-title { text-align: center; font-size: 20px; font-weight: 700; margin: 50px 0 30px; letter-spacing: .14em; color: var(--muted); }
.stats-row { margin: 24px 0 72px; }
.stat { text-align: center; }
@media (max-width: 768px) { nav { display: none; } .grid3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="topbar"><div class="container topbar-inner">
  <a class="logo" href="#"><span class="logo-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 2-2 9h6l-9 11 2-9H4Z"/></svg></span>帧数战神</a>
  <nav aria-label="主导航"><a href="#features">功能</a><a href="#stats">成效</a><a href="../style-catalog.html">风格目录</a></nav>
  <a class="btn btn-primary" href="#">提交纪录</a>
</div></header>
<main>
  <section class="hero container"><div>
    <p class="doc-meta">本周纪录 12 条 · 验证录像已归档 · Any% / 100%</p>
    <h1>比快更快，快到规则要重写</h1>
    <p class="sub">速通社区：帧级操作、逐帧验证、公开录像。我们崇拜路线，也崇拜改路线的人。</p>
    <div class="cta-row"><a class="btn btn-primary" href="#">提交纪录</a><a class="btn" href="#">看本周榜</a></div>
  </div></section>
  <section id="features" class="container">
    <h2 class="section-title">FRAME LORDS SR COMMUNITY</h2>
    <div class="grid3"><article class="card"><div class="card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><h3>路线库</h3><p>每关最优路线图解，含两个存档点的帧窗口表。</p></article><article class="card"><div class="card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><h3>验证组</h3><p>三人交叉审录像，截帧存证，公示七天。</p></article><article class="card"><div class="card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div><h3>周赛</h3><p>周四晚 Any% 小时赛，新人组单独计分。</p></article></div>
  </section>
  <section id="stats" class="container">
    <div class="grid3 stats-row"><div class="card stat"><b>12条</b><span>本周新纪录</span></div><div class="card stat"><b>3人</b><span>交叉验证</span></div><div class="card stat"><b>58:31</b><span>当前 Any% WR</span></div></div>
  </section>
</main>
<footer>帧数战神 · 速通社区 · <a href="../style-catalog.html">返回风格目录</a></footer>

</body>
</html>
