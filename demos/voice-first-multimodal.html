<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>Voice-First Multimodal · 风格样张 — ui-ux-pro-max + frontend-design</title>
<style>
@import url('https://fonts.googleapis.com/css2?Nunito+Sans:wght@300;400;500;600;700&family=Varela+Round&display=swap');
:root {
  --bg: #F8FAFC; --fg: #0F172A; --muted: #475569; --card: #FFFFFF;
  --border: rgba(250,250,250,.28); --primary: #FAFAFA; --secondary: #6B8FAF;
  --accent: #9B8FBB; --on-primary: #111;
  --radius: 14px; --btn-radius: 999px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Nunito Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--fg); line-height: 1.6;
  
}
h1, h2, h3, .num { font-family: 'Varela Round', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.topbar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid rgba(250,250,250,.28); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 62px; }
.logo { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--fg); font-family: 'Varela Round', sans-serif; }
.logo-mark { width: 32px; height: 32px; border-radius: calc(var(--radius) * .6);
  background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
nav { display: flex; gap: 22px; }
nav a { color: var(--muted); text-decoration: none; font-size: 14.5px; }
nav a:hover, nav a:focus-visible { color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: 14.5px;
  padding: 11px 22px; border-radius: var(--btn-radius);
  cursor: pointer; text-decoration: none; border: 1px solid rgba(250,250,250,.28);
  background: var(--card); color: var(--fg);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
}
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-primary:hover { transform: translateY(-2px);  }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.card { background: var(--card); border: 1px solid rgba(250,250,250,.28); border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(250,250,250,.13); padding: 24px;
  transition: transform 200ms ease, box-shadow 200ms ease; }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(250,250,250,.2);  }
.card-icon { width: 42px; height: 42px; border-radius: calc(var(--radius) * .7);
  background: var(--primary); color: var(--on-primary);
  display: grid; place-items: center; margin-bottom: 14px; }
.card h3 { font-size: 16.5px; margin-bottom: 6px; }
.card p { font-size: 13.5px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.stat b { display: block; font-size: 34px; font-weight: 800; color: var(--primary); }
.stat span { font-size: 13px; color: var(--muted); }
footer { border-top: 1px solid rgba(250,250,250,.28); padding: 26px 0; text-align: center; font-size: 13px; color: var(--muted); }
footer a { color: var(--primary); }
@keyframes gradflow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.card-icon { border-radius: 50%; animation: listen 1.8s ease-in-out infinite; } @keyframes listen { 0%,100%{box-shadow:0 0 0 0 rgba(59,124,184,.35)} 50%{box-shadow:0 0 0 14px rgba(59,124,184,0)} } .wave{display:inline-flex;gap:4px;align-items:center;height:26px;margin-left:10px}.wave i{width:4px;border-radius:3px;background:var(--primary);animation:wavebar 1.2s ease-in-out infinite}.wave i:nth-child(1){height:30%}.wave i:nth-child(2){height:75%;animation-delay:.15s}.wave i:nth-child(3){height:100%;animation-delay:.3s}.wave i:nth-child(4){height:60%;animation-delay:.45s}.wave i:nth-child(5){height:35%;animation-delay:.6s}@keyframes wavebar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.hero { padding: 72px 0 48px; text-align: center; position: relative; }
.doc-meta {
  font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted);
  letter-spacing: .04em; margin-bottom: 20px;
  display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center;
}
h1 { font-size: clamp(32px, 5vw, 54px); font-weight: 800; line-height: 1.16; margin-bottom: 18px;  }
.hl { color: var(--primary); }
.sub { font-size: 17px; color: var(--muted); max-width: 560px; margin: 0 auto 34px; }
.cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.section-title { text-align: center; font-size: 20px; font-weight: 700; margin: 50px 0 30px; letter-spacing: .14em; color: var(--muted); }
.stats-row { margin: 24px 0 72px; }
.stat { text-align: center; }
@media (max-width: 768px) { nav { display: none; } .grid3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="topbar"><div class="container topbar-inner">
  <a class="logo" href="#"><span class="logo-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 2-2 9h6l-9 11 2-9H4Z"/></svg></span>城市声档</a>
  <nav aria-label="主导航"><a href="#features">功能</a><a href="#stats">成效</a><a href="../style-catalog.html">风格目录</a></nav>
  <a class="btn btn-primary" href="#">听最新入档</a>
</div></header>
<main>
  <section class="hero container"><div>
    <p class="doc-meta">档案编号 SA-2026 · 已收录 1,842 条 · CC 授权</p>
    <h1>这座城市的耳朵，借你一副</h1><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <p class="sub">城市声音档案：早市叫卖、末班地铁、桥洞回声。全部条目可免费用于创作。</p>
    <div class="cta-row"><a class="btn btn-primary" href="#">听最新入档</a><a class="btn" href="#">投稿声音</a></div>
  </div></section>
  <section id="features" class="container">
    <h2 class="section-title">CITY SOUND ARCHIVE</h2>
    <div class="grid3"><article class="card"><div class="card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><h3>新入档</h3><p>菜市场卷帘门的开合声，凌晨四点四十，收音距离 2 米。</p></article><article class="card"><div class="card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><h3>夜班主题包</h3><p>36 条夜的声音：末班公交、急诊走廊、便利店门铃。</p></article><article class="card"><div class="card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div><h3>投稿</h3><p>手机即可投稿，注明时间地点，审核后编号入档。</p></article></div>
  </section>
  <section id="stats" class="container">
    <div class="grid3 stats-row"><div class="card stat"><b>1,842</b><span>在档条目</span></div><div class="card stat"><b>36条</b><span>夜班主题</span></div><div class="card stat"><b>2m</b><span>标准收音距</span></div></div>
  </section>
</main>
<footer>城市声档 · 公共档案 · <a href="../style-catalog.html">返回风格目录</a></footer>

</body>
</html>
